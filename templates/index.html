<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DFTR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; padding: 20px; margin: 0; }
        .box { max-width: 600px; margin: 20px auto; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; }
        h1, h2 { text-align: center; margin: 0 0 15px 0; }
        .step { display: none; }
        .nav { text-align: center; margin-top: 20px; }
        button { padding: 10px 25px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; margin: 3px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #444; }
        button:disabled { opacity: 0.5; }
        .cards { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; cursor: pointer; text-align: center; min-width: 100px; }
        .card.sel { background: rgba(102,126,234,0.4); border: 2px solid #667eea; }
        .feat-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
        .feat { background: rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .feat.sel { background: rgba(102,126,234,0.4); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; }
        .stat { background: rgba(255,255,255,0.1); padding: 12px; text-align: center; border-radius: 8px; }
        .stat-num { font-size: 20px; color: #a5b4fc; }
        .events { max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 8px; }
        .evt { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        .evt-time { color: #a5b4fc; font-size: 11px; }
        .inp { display: flex; gap: 10px; justify-content: center; margin: 15px 0; }
        .inp div { text-align: center; }
        .inp label { display: block; margin-bottom: 5px; color: #aaa; font-size: 13px; }
        .inp input { padding: 8px; background: rgba(255,255,255,0.1); border: 1px solid #444; color: white; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="box">
        <div id="step1" style="display:block;">
            <h1>DFTR Tool</h1>
            <p style="text-align:center;color:#888;">Digital Forensic Timeline</p>
            <div class="inp">
                <div>
                    <label>Start Date & Time</label>
                    <input type="datetime-local" id="start">
                </div>
                <div>
                    <label>End Date & Time</label>
                    <input type="datetime-local" id="end">
                </div>
            </div>
            <div class="nav"><button class="btn-primary" onclick="goto(2)">Continue</button></div>
        </div>

        <div id="step2" style="display:none;">
            <h2>Select Access Mode</h2>
            <div class="cards">
                <div class="card" id="nonadmin" onclick="setMode('non-admin')">👤 Non-Admin</div>
                <div class="card" id="admin" onclick="setMode('admin')">⚡ Admin</div>
            </div>
            <div class="nav">
                <button class="btn-secondary" onclick="goto(1)">Back</button>
                <button class="btn-primary" id="btn2" onclick="goto(3)" disabled>Continue</button>
            </div>
        </div>

        <div id="step3" style="display:none;">
            <h2>Select Features</h2>
            <div class="feat-list" id="features"></div>
            <div class="nav">
                <button class="btn-secondary" onclick="goto(2)">Back</button>
                <button class="btn-primary" id="btn3" onclick="goto(4)" disabled>Continue</button>
            </div>
        </div>

        <div id="step4" style="display:none;">
            <h2>Select Confidence</h2>
            <div class="cards">
                <div class="card" id="high" onclick="setConf('HIGH')">✓ HIGH</div>
                <div class="card" id="med" onclick="setConf('MEDIUM')">! MEDIUM</div>
                <div class="card" id="low" onclick="setConf('LOW')">✗ LOW</div>
            </div>
            <div class="nav">
                <button class="btn-secondary" onclick="goto(3)">Back</button>
                <button class="btn-primary" id="btn4" onclick="submit()" disabled>Submit</button>
            </div>
        </div>

        <div id="step5" style="display:none;">
            <h2>Results</h2>
            <div class="stats">
                <div class="stat"><div class="stat-num" id="t1">0</div><div>Total</div></div>
                <div class="stat"><div class="stat-num" id="t2">0</div><div>Correlated</div></div>
                <div class="stat"><div class="stat-num" id="t3">0</div><div>Sources</div></div>
                <div class="stat"><div class="stat-num" id="t4">0</div><div>Types</div></div>
            </div>
            <div class="events" id="events"></div>
        </div>
    </div>

    <script>
        var mode = null, feats = [], confs = [], allevents = [];
        var data = [
            {id:'bh',n:'Browser History'},
            {id:'fm',n:'File Metadata'},
            {id:'rf',n:'Recent Files'},
            {id:'dl',n:'Downloads'},
            {id:'cb',n:'Clipboard'},
            {id:'usb',n:'USB'},
            {id:'au',n:'App Usage'},
            {id:'ss',n:'Startup'},
            {id:'tf',n:'Temp Files'}
        ];
        
        var today = new Date();
        today.setMinutes(today.getMinutes() - today.getTimezoneOffset());
        var weekAgo = new Date(Date.now() - 7*86400000);
        weekAgo.setMinutes(weekAgo.getMinutes() - weekAgo.getTimezoneOffset());
        
        // Format for datetime-local input (YYYY-MM-DDTHH:MM)
        var formatDateTimeLocal = function(d) {
            return d.toISOString().slice(0, 16);
        };
        
        document.getElementById('start').value = formatDateTimeLocal(weekAgo);
        document.getElementById('end').value = formatDateTimeLocal(today);
        
        var fdiv = document.getElementById('features');
        for(var i=0;i<data.length;i++){
            fdiv.innerHTML = fdiv.innerHTML + '<div class="feat" id="f'+data[i].id+'" onclick="toggleFeat(\''+data[i].id+'\')">'+data[i].n+'</div>';
        }
        
        function goto(n){
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step3').style.display = 'none';
            document.getElementById('step4').style.display = 'none';
            document.getElementById('step5').style.display = 'none';
            document.getElementById('step'+n).style.display = 'block';
        }
        
        function setMode(m){
            mode = m;
            document.getElementById('nonadmin').className = 'card';
            document.getElementById('admin').className = 'card';
            document.getElementById(m==='non-admin'?'nonadmin':'admin').className = 'card sel';
            document.getElementById('btn2').disabled = false;
        }
        
        function toggleFeat(id){
            var idx = feats.indexOf(id);
            if(idx>-1){ feats.splice(idx,1); document.getElementById('f'+id).className = 'feat'; }
            else{ feats.push(id); document.getElementById('f'+id).className = 'feat sel'; }
            document.getElementById('btn3').disabled = feats.length===0;
        }
        
        function setConf(c){
            var idx = confs.indexOf(c);
            var ids = c==='MEDIUM'?'med':c.toLowerCase();
            if(idx>-1){ confs.splice(idx,1); document.getElementById(ids).className = 'card'; }
            else{ confs.push(c); document.getElementById(ids).className = 'card sel'; }
            document.getElementById('btn4').disabled = confs.length===0;
        }
        
        function submit(){
            goto(5);
            
            // Show loading state
            document.getElementById('events').innerHTML = '<div style="padding:15px;text-align:center;">Loading...</div>';
            
            // Get selected dates
            var startDate = document.getElementById('start').value;
            var endDate = document.getElementById('end').value;
            
            // Map feature IDs to source names
            var sourceMap = {
                'bh': 'browser_history',
                'fm': 'file_metadata',
                'rf': 'recent_files',
                'dl': 'downloads',
                'cb': 'clipboard',
                'usb': 'usb',
                'au': 'app_usage',
                'ss': 'startup_shutdown',
                'tf': 'temp_files'
            };
            
            // Convert selected feature IDs to source names
            var selectedSources = feats.map(function(fid) {
                return sourceMap[fid] || fid;
            });
            
            // If no features selected, use all sources
            if (selectedSources.length === 0) {
                selectedSources = Object.values(sourceMap);
            }
            
            var x = new XMLHttpRequest();
            x.open('POST','/api/collect',true);
            x.setRequestHeader('Content-Type','application/json');
            x.onload = function(){
                // Collect completed, now fetch events - NO filters for now to debug
                var eventUrl = '/api/events';
                
                var x2 = new XMLHttpRequest();
                x2.open('GET', eventUrl, true);
                x2.onload = function(){ 
                    try {
                        var response = JSON.parse(x2.responseText);
                        allevents = response.events || [];
                        showEvents();
                    } catch(e) { 
                        document.getElementById('events').innerHTML = '<div style="padding:15px;text-align:center;color:red;">Error parsing: ' + e + '</div>'; 
                    }
                };
                x2.onerror = function(){ 
                    document.getElementById('events').innerHTML = '<div style="padding:15px;text-align:center;color:red;">Error fetching events - check console</div>'; 
                };
                x2.send();
            };
            x.onerror = function(){ 
                document.getElementById('events').innerHTML = '<div style="padding:15px;text-align:center;color:red;">Error collecting data</div>'; 
            };
            x.send(JSON.stringify({
                mode: mode === 'admin' ? 'advanced' : 'standard',
                sources: selectedSources,
                confidences: confs,
                start_date: startDate,
                end_date: endDate
            }));
        }
        
        function showEvents(){
            var f = allevents;
            f.sort(function(a,b){ if(!a.timestamp)return 1; if(!b.timestamp)return -1; return new Date(b.timestamp)-new Date(a.timestamp); });
            document.getElementById('t1').textContent = f.length;
            document.getElementById('t2').textContent = f.filter(function(e){return e.correlated;}).length;
            document.getElementById('t3').textContent = Object.keys(f.reduce(function(s,e){s[e.source]=1;return s;},{})).length;
            document.getElementById('t4').textContent = Object.keys(f.reduce(function(t,e){if(e.event_type)t[e.event_type]=1;return t;},{})).length;
            
            if (f.length === 0) {
                document.getElementById('events').innerHTML = '<div style="padding:15px;text-align:center;">No events found</div>';
                return;
            }
            
            var h = '';
            for(var i=0;i<Math.min(f.length,50);i++){
                var e = f[i];
                var time = e.timestamp ? new Date(e.timestamp).toLocaleString() : 'UNKNOWN';
                var desc = e.description || e.object || 'N/A';
                h += '<div class="evt"><span class="evt-time">' + time + '</span> - ' + desc + '</div>';
            }
            document.getElementById('events').innerHTML = h;
        }
    </script>
</body>
</html>
